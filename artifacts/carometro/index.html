  <body>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/gh/spbgovbr-vlibras/vlibras-portal@sgd/app/vlibras-plugin.js" defer></script>
    <script>
      window.addEventListener("load", function () {
        try {
          if (window.VLibras && window.VLibras.Widget) {
            new window.VLibras.Widget("https://cdn.jsdelivr.net/gh/spbgovbr-vlibras/vlibras-portal@sgd/app");
          } else {
            console.warn("VLibras: plugin não carregou");
          }
        } catch (e) {
          console.warn("VLibras: falha ao inicializar", e);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
