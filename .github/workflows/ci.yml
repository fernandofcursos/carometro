name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: TypeScript + unit tests + cobertura ──────────────────────────
  backend:
    name: Backend (TypeScript + Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud precisa do histórico completo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @workspace/db
        run: pnpm --filter @workspace/db run build
        env:
          DATABASE_URL: postgresql://test:test@localhost/test

      - name: TypeScript check (api-server)
        run: pnpm --filter @workspace/api-server run typecheck
        env:
          DATABASE_URL: postgresql://test:test@localhost/test

      - name: Run tests with coverage
        run: pnpm --filter @workspace/api-server run test -- --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
          SESSION_SECRET: ci-test-secret-must-be-at-least-32-chars-long!!
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/api-server/coverage/lcov.info
          retention-days: 1

  # ── Frontend: TypeScript check ────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @workspace/db
        run: pnpm --filter @workspace/db run build
        env:
          DATABASE_URL: postgresql://test:test@localhost/test

      - name: Build @workspace/api-client-react
        run: pnpm --filter @workspace/api-client-react run build

      - name: TypeScript check (seshat frontend)
        run: pnpm --filter @workspace/seshat run typecheck

  # ── SonarCloud Analysis ───────────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() && !cancelled()

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para blame e histórico do Sonar

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/api-server/coverage
        continue-on-error: true  # não bloqueia Sonar se backend falhou

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

