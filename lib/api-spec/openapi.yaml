  /usuarios/{id}/resetar-senha:
    post:
      operationId: resetarSenhaUsuario
      tags: [usuarios]
      summary: Reset password for a usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetarSenhaResponse"

  /usuarios/{id}/disciplinas:
    put:
      operationId: setUsuarioDisciplinas
      tags: [usuarios]
      summary: Set disciplinas for a usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDisciplinasInput"
      responses:
        "200":
          description: Updated usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"

  /usuarios/{id}/roles:
    put:
      operationId: setUsuarioRoles
      tags: [usuarios]
      summary: Set roles for a usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolesInput"
      responses:
        "200":
          description: Updated roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleSummary"

  /usuarios/{id}/foto:
    put:
      operationId: uploadFotoUsuario
      tags: [usuarios]
      summary: Upload or update profile photo for a usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadFotoUsuarioBody"
      responses:
        "200":
          description: Updated usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
