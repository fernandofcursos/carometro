          description: Usuario not found

  /disciplinas:
    get:
      operationId: listDisciplinas
      tags: [disciplinas]
      summary: List all disciplinas
      responses:
        "200":
          description: List of disciplinas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Disciplina"
    post:
      operationId: createDisciplina
      tags: [disciplinas]
      summary: Create a disciplina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisciplinaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disciplina"

  /disciplinas/{id}:
    put:
      operationId: updateDisciplina
      tags: [disciplinas]
      summary: Update a disciplina
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisciplinaInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disciplina"
    delete:
      operationId: deleteDisciplina
      tags: [disciplinas]
      summary: Delete a disciplina
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /disciplinas/{id}/ofertas:
    put:
      operationId: setDisciplinaOfertas
      tags: [disciplinas]
      summary: Set cursos and turnos (ofertas) for a disciplina
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDisciplinaOfertasInput"
      responses:
        "200":
          description: Updated disciplina with ofertas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disciplina"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginInput:
      type: object
      required: [codigoAcesso, senha]
      properties:
        codigoAcesso:
          type: string
        senha:
          type: string

    ChangePasswordInput:
      type: object
      required: [senhaAtual, senhaNova]
      properties:
        senhaAtual:
          type: string
        senhaNova:
          type: string
          minLength: 6

    AuthMe:
      type: object
      required: [id, email, codigoAcesso, primeiroAcesso, roles, permissions, disciplinas]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        codigoAcesso:
          type: string
        primeiroAcesso:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        disciplinas:
          type: array
          items:
            $ref: "#/components/schemas/UsuarioDisciplina"

    UsuarioDisciplina:
      type: object
      required: [ofertaId, disciplinaId, disciplinaNome, cursoId, cursoNome, turnoId, turnoNome]
      properties:
        ofertaId:
          type: string
          format: uuid
        disciplinaId:
          type: string
          format: uuid
        disciplinaNome:
          type: string
        cursoId:
          type: string
          format: uuid
        cursoNome:
          type: string
        turnoId:
          type: string
          format: uuid
        turnoNome:
          type: string

    Turno:
      type: object
      required: [id, nome, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        criadoEm:
          type: string

    TurnoInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1

    Curso:
      type: object
      required: [id, sigla, nome, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        sigla:
          type: string
          maxLength: 4
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        moduloMenor:
          type: boolean
        ativo:
          type: boolean
        criadoEm:
          type: string

    CursoInput:
      type: object
      required: [sigla, nome]
      properties:
        sigla:
          type: string
          maxLength: 4
          minLength: 1
        nome:
          type: string
          minLength: 1
        descricao:
          type: string
          nullable: true
        moduloMenor:
          type: boolean
        ativo:
          type: boolean

    Turma:
      type: object
      required: [id, sigla, descricao, turnoId, turnoNome, cursoId, cursoNome, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        sigla:
          type: string
        descricao:
          type: string
        turnoId:
          type: string
          format: uuid
        turnoNome:
          type: string
        cursoId:
          type: string
          format: uuid
        cursoNome:
          type: string
        criadoEm:
          type: string

    TurmaInput:
      type: object
      required: [sigla, descricao, turnoId, cursoId]
      properties:
        sigla:
          type: string
        descricao:
          type: string
        turnoId:
          type: string
          format: uuid
        cursoId:
          type: string
          format: uuid

    EstudanteEmail:
      type: object
      required: [id, email, tipo]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        tipo:
          type: string
          enum: [proprio, responsavel]

    EstudanteEmailInput:
      type: object
      required: [email, tipo]
      properties:
        email:
          type: string
        tipo:
          type: string
          enum: [proprio, responsavel]

    Estudante:
      type: object
      required: [id, nome, registro, turmaId, turmaSigla, turmaDescricao, turnoNome, cursoNome, criadoEm, emails]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        registro:
          type: string
        fotoUrl:
          type: string
          nullable: true
        observacao:
          type: string
          nullable: true
        emails:
          type: array
          items:
            $ref: "#/components/schemas/EstudanteEmail"
        turmaId:
          type: string
          format: uuid
        turmaSigla:
          type: string
        turmaDescricao:
          type: string
        turnoNome:
          type: string
        cursoNome:
          type: string
        criadoEm:
          type: string

    EstudanteInput:
      type: object
      required: [nome, registro, turmaId]
      properties:
        nome:
          type: string
          minLength: 1
        registro:
          type: string
          minLength: 1
        observacao:
          type: string
          nullable: true
          maxLength: 300
        emails:
          type: array
          items:
            $ref: "#/components/schemas/EstudanteEmailInput"
        turmaId:
          type: string
          format: uuid

    EstudanteUpdate:
      type: object
      required: [nome, registro, turmaId]
      properties:
        nome:
          type: string
          minLength: 1
        registro:
          type: string
          minLength: 1
        observacao:
          type: string
          nullable: true
          maxLength: 300
        emails:
          type: array
          items:
            $ref: "#/components/schemas/EstudanteEmailInput"
        turmaId:
          type: string
          format: uuid

    FotoInput:
      type: object
      required: [fotoBase64]
      properties:
        fotoBase64:
          type: string

    CarometroEstudante:
      type: object
      required: [id, nome, registro, fotoUrl]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        registro:
          type: string
        fotoUrl:
          type: string
          nullable: true

    CarometroGroup:
      type: object
      required: [turmaId, turmaSigla, turmaDescricao, turnoNome, cursoNome, estudantes]
      properties:
        turmaId:
          type: string
          format: uuid
        turmaSigla:
          type: string
        turmaDescricao:
          type: string
        turnoNome:
          type: string
        cursoNome:
          type: string
        estudantes:
          type: array
          items:
            $ref: "#/components/schemas/CarometroEstudante"

    Stats:
      type: object
      required: [totalEstudantes, totalTurmas, totalCursos, totalTurnos, comFoto, semFoto]
      properties:
        totalEstudantes:
          type: integer
        totalTurmas:
          type: integer
        totalCursos:
          type: integer
        totalTurnos:
          type: integer
        comFoto:
          type: integer
        semFoto:
          type: integer

    ImportRow:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true

    ImportCursosBody:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"

    ImportTurmasBody:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"

    ImportEstudantesBody:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"

    ImportDisciplinasBody:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"

    ImportProfessoresBody:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"

    ImportResult:
      type: object
      required: [imported, errors]
      properties:
        imported:
          type: integer
        errors:
          type: array
          items:
            type: string

    TipoOcorrencia:
      type: object
      required: [id, descricao, status, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        descricao:
          type: string
        status:
          type: string
          enum: [ativo, inativo]
        criadoEm:
          type: string

    TipoOcorrenciaInput:
      type: object
      required: [descricao]
      properties:
        descricao:
          type: string
          minLength: 1
        status:
          type: string
          enum: [ativo, inativo]

    Ocorrencia:
      type: object
      required: [id, estudanteId, estudanteNome, tipoOcorrenciaId, tipoOcorrenciaDescricao, dataOcorrencia, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        estudanteId:
          type: string
          format: uuid
        estudanteNome:
          type: string
        tipoOcorrenciaId:
          type: string
          format: uuid
        tipoOcorrenciaDescricao:
          type: string
        disciplinaId:
          type: string
          format: uuid
          nullable: true
        disciplinaNome:
          type: string
          nullable: true
        registradoPorId:
          type: string
          format: uuid
          nullable: true
        registradoPorNome:
          type: string
          nullable: true
        dataOcorrencia:
          type: string
        observacao:
          type: string
          nullable: true
        criadoEm:
          type: string

    OcorrenciaInput:
      type: object
      required: [estudanteId, tipoOcorrenciaId, dataOcorrencia]
      properties:
        estudanteId:
          type: string
          format: uuid
        tipoOcorrenciaId:
          type: string
          format: uuid
        disciplinaId:
          type: string
          format: uuid
          nullable: true
        registradoPorId:
          type: string
          format: uuid
          nullable: true
        dataOcorrencia:
          type: string
        observacao:
          type: string
          nullable: true
        enviarEmail:
          type: boolean
          nullable: true

    Role:
      type: object
      required: [id, nome, ativo, permissoes, criadoEm, atualizadoEm]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        ativo:
          type: boolean
        permissoes:
          type: array
          items:
            type: string
        criadoEm:
          type: string
        atualizadoEm:
          type: string

    RoleInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1
        descricao:
          type: string
        ativo:
          type: boolean

    Permissao:
      type: object
      required: [id, recurso, acao, chave]
      properties:
        id:
          type: string
          format: uuid
        recurso:
          type: string
        acao:
          type: string
        chave:
          type: string
        descricao:
          type: string
          nullable: true

    SetPermissoesInput:
      type: object
      required: [permissoes]
      properties:
        permissoes:
          type: array
          items:
            type: string

    SetRolesInput:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items:
            type: string
            format: uuid

    UploadFotoUsuarioBody:
      type: object
      required: [fotoBase64]
      properties:
        fotoBase64:
          type: string
          description: Base64-encoded JPEG image (data URL)

    Usuario:
      type: object
      required: [id, email, codigoAcesso, primeiroAcesso, fotoUrl, roles, disciplinas, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          nullable: true
        email:
          type: string
        dataNascimento:
          type: string
          format: date
          nullable: true
          description: Data de nascimento (YYYY-MM-DD). Obrigatória quando o perfil "estudante" for atribuído a menores de 18 anos.
        codigoAcesso:
          type: string
        primeiroAcesso:
          type: boolean
        fotoUrl:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"
          description: >
            Um usuário pode ter múltiplos perfis simultaneamente.
            Exceção: usuários com o perfil "estudante" e menores de 18 anos
            só podem ter esse único perfil — nenhum outro pode ser combinado.
        disciplinas:
          type: array
          items:
            $ref: "#/components/schemas/UsuarioDisciplina"
        criadoEm:
          type: string

    RoleSummary:
      type: object
      required: [id, nome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string

    UsuarioCreated:
      type: object
      required: [usuario, senhaGerada]
      properties:
        usuario:
          $ref: "#/components/schemas/Usuario"
        senhaGerada:
          type: string
          description: >
            Plain text password shown only once. An e-mail with these
            credentials is also sent to the user's address automatically.

    UsuarioInput:
      type: object
      required: [email]
      properties:
        nome:
          type: string
          nullable: true
        email:
          type: string
        dataNascimento:
          type: string
          format: date
          nullable: true
          description: YYYY-MM-DD. Obrigatória se roleIds incluir o perfil "estudante" e o usuário for menor de 18 anos.
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            IDs dos perfis a atribuir. Múltiplos perfis são permitidos.
            Restrição: se o perfil "estudante" for incluído e dataNascimento
            indicar idade < 18 anos, nenhum outro perfil pode ser combinado.
        disciplinaOfertaIds:
          type: array
          items:
            type: string
            format: uuid

    UsuarioUpdate:
      type: object
      properties:
        nome:
          type: string
          nullable: true
        email:
          type: string
        dataNascimento:
          type: string
          format: date
          nullable: true
        primeiroAcesso:
          type: boolean

    ResetarSenhaResponse:
      type: object
      required: [senhaGerada]
      properties:
        senhaGerada:
          type: string

    Disciplina:
      type: object
      required: [id, nome, criadoEm, ofertas]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        criadoEm:
          type: string
        ofertas:
          type: array
          items:
            $ref: "#/components/schemas/DisciplinaOferta"

    DisciplinaOferta:
      type: object
      required: [id, disciplinaId, cursoId, cursoNome, turnoId, turnoNome]
      properties:
        id:
          type: string
          format: uuid
        disciplinaId:
          type: string
          format: uuid
        cursoId:
          type: string
          format: uuid
        cursoNome:
          type: string
        turnoId:
          type: string
          format: uuid
        turnoNome:
          type: string

    DisciplinaInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1

    SetDisciplinaOfertasInput:
      type: object
      required: [ofertas]
      properties:
        ofertas:
          type: array
          items:
            type: object
            required: [cursoId, turnoId]
            properties:
              cursoId:
                type: string
                format: uuid
              turnoId:
                type: string
                format: uuid

    SetDisciplinasInput:
      type: object
      required: [disciplinaOfertaIds]
      properties:
        disciplinaOfertaIds:
          type: array
          items:
            type: string
            format: uuid

    CarometroGrupoResponse:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/CarometroGrupoSection"

    CarometroGrupoSection:
      type: object
      required: [turnoNome, usuarios]
      properties:
        turnoNome:
          type: string
        cursoNome:
          type: string
          nullable: true
        usuarios:
          type: array
          items:
            $ref: "#/components/schemas/CarometroUsuarioItem"

    CarometroUsuarioItem:
      type: object
      required: [id, nome, fotoUrl, roles, disciplinas]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          nullable: true
        fotoUrl:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        disciplinas:
          type: array
          items:
            type: string
        vinculados:
          type: array
          description: Usuários vinculados (filhos) — apenas para pai/responsável
          items:
            type: object
            properties:
              id:
                type: string
              nome:
                type: string
                nullable: true
