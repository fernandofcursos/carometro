# Grafana — datasource provisionado automaticamente
# Conexão interna: Grafana → Prometheus (sem passar pelo nginx)
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false        # evita alteração acidental em produção
    jsonData:
      timeInterval: "15s"  # alinhado com scrape_interval
