# =============================================================================
# nginx/nginx.conf — TLS termination + proxy reverso + monitoramento
#
# Roteamento:
#   /api/metrics  → BLOQUEADO externamente (403) — apenas Prometheus interno
#   /api/*        → api-server:8080  (Express)
#   /grafana/     → grafana:3000     (autenticação própria do Grafana)
#   /prometheus/  → prometheus:9090  (HTTP Basic Auth via monitoring.htpasswd)
#   /*            → frontend estático (Vite build)
#
# Segurança (ISO 27001 A.8.20 / A.8.24 / A.8.26):
#   - TLS 1.2/1.3 + cifras fortes
#   - HSTS, X-Frame-Options, CSP headers
#   - /api/metrics bloqueado por nginx; proteção adicional por IP no api-server
#   - /prometheus/ exige HTTP Basic Auth (htpasswd)
#   - Grafana e Prometheus em rede interna (monitoring_net); nunca direto ao host
#
# LGPD: nenhum dado pessoal nos logs de acesso (apenas IP + rota + status)
# =============================================================================

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs estruturados — ISO 27001 A.8.15
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml;

  # ---------------------------------------------------------------------------
  # HTTP → HTTPS redirect
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ---------------------------------------------------------------------------
  # HTTPS — TLS termination + proxy
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # ISO 27001 A.8.24 — criptografia em trânsito
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # Security headers — ISO 27001 A.8.26
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(self)"        always;

    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # /api/metrics — BLOQUEADO externamente (ISO 27001 A.8.20 / LGPD)
    # Prometheus acessa diretamente via rede interna (monitoring_net),
    # nunca pelo nginx. Dupla proteção: nginx 403 + IP allowlist no api-server.
    # -------------------------------------------------------------------------
    location = /api/metrics {
      return 403;
    }

    # -------------------------------------------------------------------------
    # /api/* — proxy para api-server Express
    # -------------------------------------------------------------------------
    location /api/ {
      proxy_pass         http://api-server:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cookie_path  / "/; SameSite=Lax";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # /grafana/ — proxy para Grafana (autenticação própria do Grafana)
    # Acesso restrito a administradores; Grafana gerencia seus próprios usuários.
    # -------------------------------------------------------------------------
    location /grafana/ {
      proxy_pass         http://grafana:3000/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      # Grafana usa WebSocket para live updates
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # /prometheus/ — proxy para Prometheus com HTTP Basic Auth obrigatório
    # ISO 27001 A.9.4: controle de acesso à interface de monitoramento.
    # Gerar: htpasswd -c nginx/monitoring.htpasswd <usuario>
    # -------------------------------------------------------------------------
    location /prometheus/ {
      # HTTP Basic Auth — impede acesso não autorizado à UI do Prometheus
      auth_basic           "Monitoramento — Acesso Restrito";
      auth_basic_user_file /etc/nginx/monitoring.htpasswd;

      proxy_pass         http://prometheus:9090/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # /* — Frontend estático (Vite build)
    # -------------------------------------------------------------------------
    location / {
      root  /usr/share/nginx/html;
      index index.html;

      # SPA fallback
      try_files $uri $uri/ /index.html;

      # Cache agressivo para assets com hash
      location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # Service Worker sem cache
      location ~* sw\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
      }
    }
  }
}
