# =============================================================================
# nginx/nginx.conf — Fase 6: TLS termination + proxy reverso
#
# Redireciona HTTP→HTTPS e encaminha:
#   /api/*  → api-server:8080  (Express)
#   /*      → frontend estático (html/js/css do Vite build)
#
# Câmera (getUserMedia) exige HTTPS fora de localhost — ISO 27001 A.8.20
# =============================================================================

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs estruturados — ISO 27001 A.8.15 (logging de eventos)
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  keepalive_timeout 65;

  # Compressão gzip para assets estáticos
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml;

  # ---------------------------------------------------------------------------
  # Servidor HTTP — redireciona tudo para HTTPS (Fase 6)
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name _;

    # Fase 6: forçar HTTPS em produção — câmera exige contexto seguro
    return 301 https://$host$request_uri;
  }

  # ---------------------------------------------------------------------------
  # Servidor HTTPS — TLS termination (Fase 6)
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl;
    server_name _;

    # Certificados — dev: auto-assinado (nginx/ssl/); prod: Let's Encrypt ou institucional
    ssl_certificate     /etc/nginx/ssl/cert.pem;     # Fase 6: certificado TLS
    ssl_certificate_key /etc/nginx/ssl/key.pem;      # Fase 6: chave privada TLS

    # Protocolos e cifras seguras — ISO 27001 A.8.24 (criptografia em trânsito)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de segurança — ISO 27001 A.8.26 (segurança em aplicações)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Fase 6: HSTS
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(self)"        always; # câmera só no próprio site

    # Limite de body para suportar fotos base64 (Fase 2: ~3.7MB binário → ~5MB base64)
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # Proxy para o api-server Express
    # -------------------------------------------------------------------------
    location /api/ {
      proxy_pass         http://api-server:8080;     # Fase 6: nome do serviço no docker-compose
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;  # necessário para req.secure no Express

      # Cookies httpOnly: garantir que os flags chegam corretos após proxy
      proxy_cookie_path  / "/; SameSite=Lax";

      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Frontend estático — build do Vite (artifacts/carometro/dist/public)
    # -------------------------------------------------------------------------
    location / {
      root  /usr/share/nginx/html;
      index index.html;

      # SPA: qualquer rota não encontrada → index.html (React Router)
      try_files $uri $uri/ /index.html;

      # Cache agressivo para assets com hash no nome (ex: index-D9F1FXzN.js)
      location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # Service Worker não deve ter cache (precisa de atualização imediata)
      location ~* sw\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
      }
    }
  }
}
