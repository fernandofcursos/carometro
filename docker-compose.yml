# =============================================================================
# Carômetro — docker-compose de desenvolvimento
#
# Simula o ambiente Replit localmente.
# Por padrão usa PostgreSQL INTERNO ao container.
# Para usar Neon (cloud), configure DATABASE_URL no .env.local.
#
# Uso:
#   docker compose up            # sobe tudo com VSCode Dev Container
#   docker compose up --build    # rebuild ao mudar o Dockerfile
#   docker compose run --rm dev shell   # abre shell interativo
#   docker compose run --rm dev codegen # roda orval codegen
#   docker compose run --rm dev db:push # aplica schema
# =============================================================================

name: carometro-dev

services:
  # ---------------------------------------------------------------------------
  # dev — container principal que simula o Replit
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache
    image: carometro-dev:local

    container_name: carometro-dev

    volumes:
      - ./:/workspace:cached                         # repositório com hot-reload
      - pnpm_store:/home/replit/.pnpm-store          # cache pnpm entre restarts
      - pg_data_dev:/var/lib/postgresql/16/main      # dados do PG interno

    working_dir: /workspace

    # Carregar variáveis de ambiente em ordem (último sobrescreve anterior).
    # .env.local (ignorado pelo git) permite usar Neon ou overrides locais.
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false

    ports:
      - "5000:5000" # Vite dev server (= Replit porta externa 80)
      - "8080:8080" # api-server Express

    # O container precisa de capacidades extras para rodar PostgreSQL internamente
    cap_add:
      - SETUID
      - SETGID

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # Comando padrão: entrypoint inicia PG (se local), instala deps,
    # aplica schema, cria admin inicial e sobe o frontend Vite.
    command: ["dev"]

    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Fase 6: nginx — TLS termination + proxy reverso (perfil "https")
  # Uso: docker compose --profile https up -d
  #
  # Pré-requisito: gerar certificado com `bash scripts/gerar-certificado-dev.sh`
  # ---------------------------------------------------------------------------
  nginx:
    profiles: ["https"]                                # Fase 6: não sobe no dev padrão
    image: nginx:alpine
    container_name: carometro-nginx
    restart: unless-stopped
    ports:
      - "80:80"                                        # Fase 6: redireciona para HTTPS
      - "443:443"                                      # Fase 6: HTTPS (câmera exige)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro    # Fase 6: config com TLS
      - ./nginx/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro  # Fase 6: certificado
      - ./nginx/ssl/key.pem:/etc/nginx/ssl/key.pem:ro    # Fase 6: chave privada
      # Em produção: montar html do build do frontend
      # - ./artifacts/carometro/dist/public:/usr/share/nginx/html:ro
    depends_on:
      dev:
        condition: service_healthy                     # Fase 6: só sobe após o dev estar pronto
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Perfil "split" — PG como serviço separado (mais próximo de produção)
  # Uso: docker compose --profile split up
  # ---------------------------------------------------------------------------
  db:
    profiles: ["split"]
    image: postgres:16-alpine
    container_name: carometro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carometro
      POSTGRES_PASSWORD: carometro
      POSTGRES_DB: carometro
      POSTGRES_INITDB_ARGS: "--locale=pt_BR.UTF-8 --encoding=UTF8"
    volumes:
      - pg_data_split:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carometro -d carometro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin — interface visual para o banco (opcional)
  # Uso: docker compose --profile tools up
  # ---------------------------------------------------------------------------
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    container_name: carometro-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@carometro.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Volumes persistentes
# ---------------------------------------------------------------------------
volumes:
  pnpm_store:
    driver: local
    name: carometro-pnpm-store

  pg_data_dev:
    driver: local
    name: carometro-pg-dev

  pg_data_split:
    driver: local
    name: carometro-pg-split

  pgadmin_data:
    driver: local
    name: carometro-pgadmin
