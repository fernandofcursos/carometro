# =============================================================================
# Seshat — docker-compose de desenvolvimento
#
# Ambiente de desenvolvimento local.
# Por padrão usa PostgreSQL INTERNO ao container.
# Para usar Neon (cloud), configure DATABASE_URL no .env.local.
#
# Uso:
#   docker compose up            # sobe tudo com VSCode Dev Container
#   docker compose up --build    # rebuild ao mudar o Dockerfile
#   docker compose run --rm dev shell       # abre shell interativo
#   docker compose run --rm dev codegen     # roda orval codegen
#   docker compose run --rm dev db:push     # aplica schema
#   docker compose run --rm dev db:seed     # cria/verifica admin
#   docker compose run --rm dev db:hash-reset  # força re-setup completo
# =============================================================================

name: seshat-dev

services:
  # ---------------------------------------------------------------------------
  # dev — container principal de desenvolvimento
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache
    image: seshat-dev:local

    container_name: seshat-dev

    volumes:
      - ./:/workspace:cached                         # repositório com hot-reload
      - pnpm_store:/root/.pnpm-store                  # cache pnpm entre restarts
      - pg_data_dev:/var/lib/postgresql/16/main      # dados do PG interno

    working_dir: /workspace

    # Carregar variáveis de ambiente em ordem (último sobrescreve anterior).
    # .env.local (ignorado pelo git) permite usar Neon ou overrides locais.
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false

    ports:
      - "5000:5000" # Vite dev server
      - "8080:8080" # api-server Express

    # O container precisa de capacidades extras para rodar PostgreSQL internamente
    cap_add:
      - SETUID
      - SETGID

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seshat -d seshat -q || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

    # Inicialização manual — o entrypoint apenas abre um shell interativo.
    # Suba os servidores manualmente no terminal do VSCode.
    command: ["shell"]

    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # nginx — TLS termination + proxy reverso (perfil "https")
  # Uso: docker compose --profile https up -d
  #
  # Pré-requisito: gerar certificado com `bash scripts/gerar-certificado-dev.sh`
  # ---------------------------------------------------------------------------
  nginx:
    profiles: ["https"]
    image: nginx:alpine
    container_name: seshat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./nginx/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Perfil "split" — PG como serviço separado (mais próximo de produção)
  # Uso: docker compose --profile split up
  # ---------------------------------------------------------------------------
  db:
    profiles: ["split"]
    image: postgres:16-alpine
    container_name: seshat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: seshat
      POSTGRES_PASSWORD: seshat
      POSTGRES_DB: seshat
      POSTGRES_INITDB_ARGS: "--locale=pt_BR.UTF-8 --encoding=UTF8"
    volumes:
      - pg_data_split:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seshat -d seshat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin — interface visual para o banco (opcional)
  # Uso: docker compose --profile tools up
  # ---------------------------------------------------------------------------
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    container_name: seshat-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@seshat.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Volumes persistentes
# ---------------------------------------------------------------------------
volumes:
  pnpm_store:
    driver: local
    name: seshat-pnpm-store

  pg_data_dev:
    driver: local
    name: seshat-pg-dev

  pg_data_split:
    driver: local
    name: seshat-pg-split

  pgadmin_data:
    driver: local
    name: seshat-pgadmin
